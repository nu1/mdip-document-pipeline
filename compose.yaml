services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_FALLBACK: ${AI_FALLBACK:-disabled}
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  backend-data:
