[project]
name = "mdip-api"
version = "0.1.0"
description = "Backend service for monorepo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.25,<2",
    "pytesseract>=0.3.13,<1",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.pyrefly]
search-path = ["."]

